server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: jobbeacon-gateway
  profiles:
    active: ${PROFILE_ACTIVE:local}
  # Local KEY=VALUE env file (git-ignored); OS environment variables still take precedence.
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      # X-Forwarded-* headers are added by default; backend needs server.forward-headers-strategy: framework
      x-forwarded:
        enabled: true
      httpclient:
        connect-timeout: 3000
        response-timeout: 60s
      routes:
        # SSE chat: no response timeout so long streams are not cut after 60s
        - id: backend-chat-stream
          uri: lb://${BACKEND_SERVICE_ID:jobbeacon-be}
          order: -1
          predicates:
            - Path=/jobbeacon-be/api/v1/chat/stream
          metadata:
            response-timeout: -1
        - id: backend
          uri: lb://${BACKEND_SERVICE_ID:jobbeacon-be}
          predicates:
            - Path=/jobbeacon-be/api/**,/jobbeacon-be/v3/api-docs/**,/jobbeacon-be/swagger-ui.html,/jobbeacon-be/swagger-ui/**,/jobbeacon-be/actuator/health
        - id: recommendation
          uri: lb://${RECOMMENDATION_SERVICE_ID:jobbeacon-recommendation}
          predicates:
            - Path=/jobbeacon-recommendation/api/**,/jobbeacon-recommendation/actuator/health

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  public-paths:
    - /actuator/health
    - /actuator/info
    - /jobbeacon-be/actuator/health
    - /jobbeacon-be/api/v1/health
    - /jobbeacon-be/swagger-ui.html
    - /jobbeacon-be/swagger-ui/**
    - /jobbeacon-be/v3/api-docs/**
    - /jobbeacon-recommendation/actuator/health
    - /jobbeacon-recommendation/api/v1/health
  # GET-only public endpoints (no token needed). Backend endpoints that don't read X-User-Id must be listed here.
  public-get-paths:
    - /jobbeacon-be/api/v1/jobs
    - /jobbeacon-be/api/v1/jobs/**
    - /jobbeacon-be/api/v1/locations/**
    - /jobbeacon-be/api/v1/categories
    - /jobbeacon-be/api/v1/companies
    - /jobbeacon-be/api/v1/companies/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    # Reactive app: talk to the registry with WebClient instead of RestTemplate.
    webclient:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

---
# Local profile only: fallback project id so the app starts without env; other profiles fail fast (blank -> AppProperties validation).
spring:
  config:
    activate:
      on-profile: local
app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:jobbeacon-local}
